services:
  - type: web
    name: luna-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LUNA_MODEL_URL
        value: https://router.huggingface.co/v1
      - key: LUNA_MODEL_NAME
        value: Qwen/Qwen2.5-7B-Instruct
      - key: LUNA_MODEL_API_KEY
        sync: false
      - key: LUNA_CLASSIFIER_URL
        sync: false
